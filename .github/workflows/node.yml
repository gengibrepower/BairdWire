name: node

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: node-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}

defaults:
  run:
    working-directory: node

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.changed.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: changed
        working-directory: .
        run: .github/scripts/changed.sh '^(node/|\.zig-version$|mise\.toml$|\.github/workflows/node\.yml$|\.github/scripts/)'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}

  fmt:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: 2026.11.7
      - run: zig fmt --check build.zig build src

  test:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [native, x86_64-linux-musl]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: 2026.11.7
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node/zig-pkg
            ~/.cache/zig
          key: zig-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('.zig-version', 'node/build.zig.zon') }}
          restore-keys: zig-${{ runner.os }}-${{ matrix.target }}-
      - run: zig build test -Dtarget=${{ matrix.target }} --summary all
      - run: zig build test -Dtarget=${{ matrix.target }} -Drelease --summary all

  release:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-linux-musl, aarch64-linux-musl]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: 2026.11.7
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node/zig-pkg
            ~/.cache/zig
          key: zig-${{ runner.os }}-release-${{ matrix.target }}-${{ hashFiles('.zig-version', 'node/build.zig.zon') }}
          restore-keys: zig-${{ runner.os }}-release-${{ matrix.target }}-
      - run: zig build -Dtarget=${{ matrix.target }} -Drelease

  node-ok:
    if: always()
    needs: [changes, fmt, test, release]
    runs-on: ubuntu-24.04
    steps:
      - working-directory: .
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -q -E 'failure|cancelled'; then exit 1; fi
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
