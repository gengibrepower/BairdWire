name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      node: ${{ steps.changed.outputs.node }}
      client: ${{ steps.changed.outputs.client }}
      deploy: ${{ steps.changed.outputs.deploy }}
      hooks: ${{ steps.changed.outputs.hooks }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: changed
        shell: sh
        run: |
          set -eu
          .github/scripts/changed.sh node '^(node/|\.zig-version$|mise\.toml$|\.github/(workflows/ci\.yml|scripts/))'
          .github/scripts/changed.sh client '^(client/|deploy/Caddyfile$|pnpm-|mise\.toml$|\.github/(workflows/ci\.yml|scripts/))'
          .github/scripts/changed.sh deploy '^(node/|client/|deploy/|pnpm-|\.zig-version$|\.dockerignore$|\.github/(workflows/ci\.yml|scripts/))'
          .github/scripts/changed.sh hooks '^(\.claude/hooks/|docs/dominio\.json$|mise\.toml$|\.github/(workflows/ci\.yml|scripts/))'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}

  fmt:
    needs: changes
    if: needs.changes.outputs.node == 'true'
    defaults:
      run:
        working-directory: node
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: 2026.11.7
      - run: zig fmt --check build.zig build src

  test:
    needs: changes
    if: needs.changes.outputs.node == 'true'
    defaults:
      run:
        working-directory: node
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [native, x86_64-linux-musl]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: 2026.11.7
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node/zig-pkg
            node/.zig-cache
            ~/.cache/zig
          key: zig-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('.zig-version', 'node/build.zig.zon', 'node/build.zig', 'node/build/**') }}
          restore-keys: zig-${{ runner.os }}-${{ matrix.target }}-
      - run: zig build test -Dtarget=${{ matrix.target }} --summary all
      - run: zig build test -Dtarget=${{ matrix.target }} -Drelease --summary all

  release:
    needs: changes
    if: needs.changes.outputs.node == 'true'
    defaults:
      run:
        working-directory: node
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-linux-musl, aarch64-linux-musl]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: 2026.11.7
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node/zig-pkg
            node/.zig-cache
            ~/.cache/zig
          key: zig-${{ runner.os }}-release-${{ matrix.target }}-${{ hashFiles('.zig-version', 'node/build.zig.zon', 'node/build.zig', 'node/build/**') }}
          restore-keys: zig-${{ runner.os }}-release-${{ matrix.target }}-
      - run: zig build -Dtarget=${{ matrix.target }} -Drelease

  check:
    needs: changes
    if: needs.changes.outputs.client == 'true'
    defaults:
      run:
        working-directory: client
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: 2026.11.7
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run check
      - run: pnpm test
      - run: pnpm run build

  compose:
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: deploy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: echo BAIRDWIRE_DOMAIN=localhost > .env
      - run: docker compose build
      - run: docker compose up -d
      - run: ./smoke.sh localhost
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v

  hooks:
    needs: changes
    if: needs.changes.outputs.hooks == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: 2026.11.7
      - run: node --test .claude/hooks/dominio.test.mjs

  ci-ok:
    if: always()
    needs: [changes, fmt, test, release, check, compose, hooks]
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -q -E 'failure|cancelled'; then exit 1; fi
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
