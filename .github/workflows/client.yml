name: client

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: client-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}

defaults:
  run:
    working-directory: client

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.changed.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: changed
        working-directory: .
        run: .github/scripts/changed.sh '^(client/|deploy/Caddyfile$|pnpm-|mise\.toml$|\.github/workflows/client\.yml$|\.github/scripts/)'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}

  check:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: 2026.11.7
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run check
      - run: pnpm test
      - run: pnpm run build

  client-ok:
    if: always()
    needs: [changes, check]
    runs-on: ubuntu-24.04
    steps:
      - working-directory: .
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -q -E 'failure|cancelled'; then exit 1; fi
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
